          <h1>WHAT IS ANTISTOIC?</h1>
          <p>Strength isn't the absence of feeling.</p>
          <p><strong>Core Definition:</strong> AntiStoic is an approach to self-reflection built around feeling what is actually happening, questioning the stories you tell yourself, separating what you can change from what you cannot, and taking a concrete next action.</p>
          <h2>NOT STOICISM. THE COSTUME.</h2>
          <p>AntiStoic is not fighting Marcus Aurelius or ancient philosophy. It pushes against modern performative invulnerability and emotional denial disguised as discipline.</p>
          <h2>THE FOUR DISCIPLINES</h2>
          <ul>
            <li><strong>Feel It:</strong> An emotion contains information without automatically being correct. Sensation is data, not a command.</li>
            <li><strong>Question It:</strong> Question the narrative attached to the feeling. Separate verifiable fact from vanity or projection.</li>
            <li><strong>Control What's Yours:</strong> Acknowledge what is beyond your reach while refusing to use lack of control as an excuse to disengage.</li>
            <li><strong>Then Move:</strong> Introspection without action is intellectual cowardice. Take the next honest move.</li>
          </ul>
          <h2>CONNECT TO THE EXPERIENCE</h2>
          <p>What's taking up space in your head? Take the interactive Reality Check at https://antistoic.com/whats-eating-you</p>
